<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NotmyFault</title>
<script>
  // CSS 加载前先写入主题属性和背景色，深色主题首屏会直接使用深色背景。
  (function() {
    var t = localStorage.getItem('nmf-theme');
    if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    document.documentElement.setAttribute('data-theme', t || 'light');
    // 背景色与 styles.css 的 --md-surface-c-low 保持一致。
    document.documentElement.style.backgroundColor = t === 'dark' ? '#1b1b21' : '#f6f3fc';
  })();
</script>
<style>
  /* Material Symbols 加载完成前保持图标隐藏，fonts-loaded 类出现后再显示。 */
  .material-symbols-outlined:not(.fonts-loaded *) { visibility: hidden; }
</style>
</head>
<body>
<div id="app"></div>
<script>
  // 字体加载完成后给根元素加 fonts-loaded 类，CSS 据此显示图标。
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function() {
      document.documentElement.classList.add('fonts-loaded');
    });
  } else {
    // 不支持 FontFace API 时直接给根元素加 fonts-loaded 类。
    document.documentElement.classList.add('fonts-loaded');
  }
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
