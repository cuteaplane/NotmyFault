[pytest]
testpaths = notmyfault/tests
python_files = test_*.py
python_classes = Test* *Tests
python_functions = test_*
markers =
    system_input: 会操作真实键鼠输入，默认不跑，要 -m system_input 显式选中
    system_native: 依赖宿主机真实桌面环境，默认不跑，要 -m system_native 显式选中
    linux_smoke: Linux 桌面最小冒烟，默认不跑，要 -m linux_smoke 显式选中
addopts = -m "not system_input and not system_native and not linux_smoke"
