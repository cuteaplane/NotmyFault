[pytest]
testpaths = notmyfault/tests
python_files = test_*.py
python_classes = Test* *Tests
python_functions = test_*
markers =
    system_native: 依赖宿主机真实桌面环境，默认不跑，要 -m system_native 显式选中
    linux_smoke: Linux 桌面最小冒烟，默认不跑，要 -m linux_smoke 显式选中
addopts = -m "not system_native and not linux_smoke"
# 单个测试超过 60 秒按挂住处理，Windows 上没有 SIGALRM，pytest-timeout 会打印卡住的测试并结束本轮
timeout = 60
